<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-C1U8xNrFF+873xqoRHdKx3YSHuAM8uyqRKPQ0/Pu38o='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="description" content="日めくりをめくるように解く、高齢の方向けの計算ゲームと豆知識つき4択クイズ。">
<meta name="theme-color" content="#1b2a4a">
<style>
html { height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
<title>まいにち計算</title>
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@700;800&family=Yuji+Syuku&display=swap">
<style>
/* Layout: 藍の壁に掛けた「日めくり」。1問＝1枚。正解で朱の花丸、めくって次の問題へ。
   色の世界をひとつに決めたデザインのため、テーマ切り替えは持たず全色を明示する */
:root {
  --ai: #1b2a4a;          /* 藍：壁 */
  --ai-deep: #111c34;
  --ai-line: rgba(255, 255, 255, 0.06);
  --washi: #f8f8f4;       /* 日めくりの紙 */
  --washi-edge: #d9dbe0;
  --sumi: #1c1f26;        /* 墨 */
  --nezumi: #5d6270;
  --shu: #cf3b2b;         /* 朱：花丸・判子 */
  --gunjo: #2b56a6;       /* 土曜の青 */
  --wall-ink: #eef1f8;
  --wall-muted: #b4bed4;
  --f-brush: "Yuji Syuku", "Shippori Mincho B1", serif;
  --f-num: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Meiryo", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--ai);
  background-image:
    radial-gradient(circle at 50% 100%, transparent 0 5px, var(--ai-line) 5px 6.5px, transparent 6.5px 11px, var(--ai-line) 11px 12.5px, transparent 12.5px 17px, var(--ai-line) 17px 18.5px, transparent 18.5px),
    radial-gradient(circle at 50% 100%, transparent 0 5px, var(--ai-line) 5px 6.5px, transparent 6.5px 11px, var(--ai-line) 11px 12.5px, transparent 12.5px 17px, var(--ai-line) 17px 18.5px, transparent 18.5px),
    linear-gradient(180deg, var(--ai) 0%, var(--ai-deep) 100%);
  background-size: 40px 20px, 40px 20px, 100% 100%;
  background-position: 0 0, 20px 10px, 0 0;
  background-attachment: scroll, scroll, fixed;
  color: var(--wall-ink);
  font-family: var(--f-body); font-size: 20px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  min-height: 100%;
}
.app {
  max-width: 500px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 36px;
}
section { display: flex; flex-direction: column; gap: 22px; }
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid #ffd27a; outline-offset: 3px; }

/* ---------- 日めくり ---------- */
.himekuri { position: relative; padding-top: 18px; }
.binding {
  position: absolute; top: 0; left: 6%; right: 6%; height: 30px; z-index: 3;
  background: linear-gradient(180deg, #2c2f37, #16181d);
  border-radius: 8px 8px 3px 3px;
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
  display: flex; justify-content: space-around; align-items: center;
}
.binding::after {
  content: "日めくり"; position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--f-brush); font-size: 0.8rem; letter-spacing: 0.4em; color: #c9ad6e;
}
.ring { width: 12px; height: 12px; border-radius: 50%; background: var(--ai-deep); box-shadow: inset 0 1px 2px #000; }
.stack { position: relative; border-radius: 4px; }
.sheet {
  position: relative; z-index: 2;
  background: var(--washi); color: var(--sumi);
  border-radius: 3px 3px 6px 6px;
  padding: 30px 20px 20px;
  box-shadow: 0 18px 30px -12px rgba(0, 0, 0, 0.55);
  background-image:
    linear-gradient(180deg, rgba(28, 31, 38, 0.06), transparent 22px),
    repeating-linear-gradient(90deg, transparent 0 3px, rgba(28, 31, 38, 0.012) 3px 4px);
  transform-origin: 50% 0;
  overflow: hidden;
}
.sheet::before { /* ミシン目 */
  content: ""; position: absolute; top: 8px; left: 14px; right: 14px; height: 0;
  border-top: 2px dotted var(--washi-edge);
}
.sheet-top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  font-family: var(--f-num); font-weight: 700; font-size: 1.05rem; color: var(--nezumi);
  border-bottom: 1px solid var(--washi-edge); padding-bottom: 8px;
}
.sheet-top b { color: var(--sumi); font-size: 1.35rem; }

/* ホームの日めくり */
.title-block { display: flex; flex-direction: column; gap: 4px; padding-inline: 4px; }
h1 {
  font-family: var(--f-brush); font-weight: 400; font-size: clamp(2.2rem, 11vw, 3.4rem);
  line-height: 1.15; letter-spacing: 0.03em; white-space: nowrap;
}
h1 .maru { color: var(--shu); }
.title-block p { color: var(--wall-muted); font-size: 1.05rem; text-wrap: pretty; }
.day {
  font-family: var(--f-num); font-weight: 800; text-align: center;
  font-size: clamp(6.5rem, 34vw, 9rem); line-height: 1; letter-spacing: -0.03em;
  font-variant-numeric: lining-nums tabular-nums; padding-top: 14px;
}
.weekday { text-align: center; font-family: var(--f-num); font-weight: 800; font-size: 1.6rem; letter-spacing: 0.2em; }
.is-sun { color: var(--shu); }
.is-sat { color: var(--gunjo); }
.sheet-foot {
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--washi-edge);
  display: flex; justify-content: center; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font-weight: 700; color: var(--nezumi);
}
.sheet-foot b { font-family: var(--f-num); font-size: 2.1rem; color: var(--shu); font-variant-numeric: tabular-nums; }

/* ---------- 選択 ---------- */
.group { display: flex; flex-direction: column; gap: 12px; }
h2 {
  font-family: var(--f-brush); font-weight: 400; font-size: 1.45rem; letter-spacing: 0.08em;
  display: flex; align-items: center; gap: 12px;
}
h2::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.2); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice {
  position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 12px;
  min-height: 92px; padding: 12px 14px; text-align: left;
  background: var(--washi); color: var(--sumi);
  border: 4px solid transparent; border-radius: 10px;
  box-shadow: 0 5px 0 #0c1426;
}
.choice:active { transform: translateY(3px); box-shadow: 0 2px 0 #0c1426; }
.choice .sym { font-family: var(--f-num); font-weight: 800; font-size: 2.3rem; line-height: 1; color: var(--ai); grid-row: span 2; }
.choice .name { font-weight: 700; font-size: 1.15rem; line-height: 1.3; }
.choice .ex { color: var(--nezumi); font-size: 1rem; line-height: 1.3; }
.choice[aria-pressed="true"] { border-color: var(--shu); }
.choice[aria-pressed="true"] .sym { color: var(--shu); }
.choice[aria-pressed="true"]::after {
  content: "選択中"; position: absolute; top: -12px; right: 8px;
  background: var(--shu); color: #fff; font-size: 0.9rem; font-weight: 700;
  padding: 1px 8px; border-radius: 4px; letter-spacing: 0.08em;
}
.choices.levels, .choices.list { grid-template-columns: 1fr; }
.levels .choice { display: flex; align-items: center; gap: 14px; min-height: 68px; padding-inline: 18px; }
.list .choice { min-height: 76px; padding-inline: 18px; column-gap: 16px; }
.levels .choice .name, .list .choice .name { font-size: 1.25rem; }
.list .choice .sym { width: 1.2em; text-align: center; }
.genres .choice { min-height: 72px; grid-template-columns: 1fr; }
.genres .choice .name { font-size: 1.1rem; }
#q-all { grid-column: 1 / -1; }

.big {
  min-height: 80px; width: 100%; border: none; border-radius: 12px;
  background: var(--shu); color: #fff;
  font-family: var(--f-brush); font-size: 1.9rem; letter-spacing: 0.25em;
  box-shadow: 0 6px 0 #7e1f15, 0 14px 24px -10px rgba(0, 0, 0, 0.6);
}
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 #7e1f15; }
.sub {
  min-height: 64px; width: 100%; border-radius: 12px;
  background: transparent; border: 2px solid rgba(255, 255, 255, 0.45); color: var(--wall-ink);
  font-weight: 700; font-size: 1.15rem;
}
.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 64px; padding: 0 18px; border-radius: 12px; width: 100%;
  background: rgba(255, 255, 255, 0.06); border: 2px solid rgba(255, 255, 255, 0.25); font-weight: 700;
}
.switch { position: relative; width: 64px; height: 36px; border-radius: 18px; background: #5b6478; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle[aria-pressed="true"] .switch { background: var(--shu); }
.toggle[aria-pressed="true"] .switch::after { transform: translateX(28px); }

/* ---------- 問題 ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.quit {
  min-height: 52px; padding: 0 18px; border-radius: 10px;
  background: transparent; border: 2px solid rgba(255, 255, 255, 0.45); font-weight: 700;
}
.marks { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.mark { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); }
.mark.now { border-color: #fff; background: rgba(255, 255, 255, 0.25); }
.mark.ok { border: 3px solid var(--shu); background: var(--washi); }
.mark.ng { border-color: var(--wall-muted); background: var(--wall-muted); }
.play-cal .sheet { padding-bottom: 16px; min-height: 300px; display: flex; flex-direction: column; }
.formula {
  font-family: var(--f-num); font-weight: 800; font-variant-numeric: lining-nums tabular-nums;
  font-size: clamp(3rem, 15vw, 4.4rem); line-height: 1.1; text-align: center; white-space: nowrap;
  padding-top: 26px;
}
.formula.long { font-size: clamp(1.9rem, 10.5vw, 3.6rem); padding-top: 30px; }
.answer-row { display: flex; justify-content: center; align-items: center; gap: 14px; padding-top: 10px; }
.answer-row .lbl { font-family: var(--f-brush); font-size: 1.2rem; color: var(--nezumi); }
.answer {
  min-width: 3.2em; text-align: center;
  font-family: var(--f-num); font-weight: 800; font-size: clamp(2.8rem, 14vw, 3.8rem); line-height: 1.15;
  font-variant-numeric: lining-nums tabular-nums;
  color: var(--ai); border-bottom: 4px dashed var(--ai);
}
.answer.empty { color: var(--washi-edge); }
.answer.red { color: var(--shu); border-bottom-color: var(--shu); }
.feedback {
  margin-top: auto; padding-top: 12px; min-height: 2.6em;
  display: grid; place-items: center; text-align: center;
  font-family: var(--f-brush); font-size: 1.4rem; line-height: 1.3; color: var(--nezumi);
}
.feedback.ok { color: var(--shu); }
.feedback.ng { color: var(--ai); }
.hanamaru {
  position: absolute; left: 50%; top: 50%; width: 230px; height: 230px; margin: -125px 0 0 -115px;
  pointer-events: none; overflow: visible; opacity: 0.88; z-index: 1;
}
.hanamaru path { fill: none; stroke: var(--shu); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.sheet > *:not(.hanamaru) { position: relative; z-index: 2; }
.play-cal .sheet::before { z-index: 2; }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key {
  min-height: 70px; border-radius: 10px; border: none;
  background: var(--washi); color: var(--sumi);
  font-family: var(--f-body); font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums;
  box-shadow: 0 5px 0 #0c1426;
}
.key:active { transform: translateY(4px); box-shadow: 0 1px 0 #0c1426; }
.key.fn { font-size: 1.1rem; background: #dfe3ec; }
.key.go { background: var(--shu); color: #fff; font-family: var(--f-brush); font-weight: 400; font-size: 1.45rem; box-shadow: 0 5px 0 #7e1f15; }
.key.go:active { box-shadow: 0 1px 0 #7e1f15; }
.pad[aria-disabled="true"] .key { opacity: 0.5; }

/* ---------- 結果 ---------- */
.result-cal .sheet { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-bottom: 26px; text-align: center; }
.result-cal .sheet-top { align-self: stretch; }
.stamp {
  margin-top: 18px; width: 210px; height: 210px; border-radius: 50%;
  border: 7px double var(--shu); color: var(--shu);
  display: grid; place-content: center; gap: 2px;
  font-family: var(--f-brush); font-size: 1.9rem; line-height: 1.25;
  transform: rotate(-9deg); opacity: 0.92;
  -webkit-mask-image: repeating-radial-gradient(circle at 30% 40%, #000 0 2px, rgba(0,0,0,.82) 2px 3px);
  mask-image: repeating-radial-gradient(circle at 30% 40%, #000 0 2px, rgba(0,0,0,.82) 2px 3px);
}
.stamp span { display: block; }
.score { font-family: var(--f-num); font-weight: 800; font-size: 4.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.5rem; color: var(--nezumi); font-weight: 700; }
.detail { color: var(--nezumi); font-weight: 700; }
.actions { display: flex; flex-direction: column; gap: 14px; }

/* ---------- 4択クイズ ---------- */
#calcOpts { gap: 22px; }
.quiz-note { color: var(--wall-muted); font-size: 1.05rem; padding-inline: 4px; }
.chip { font-family: var(--f-body); font-size: 1rem; font-weight: 700; color: #fff; background: var(--ai); border-radius: 4px; padding: 1px 10px; letter-spacing: 0.06em; }
.chip.jiji { background: var(--shu); }
.quiz-cal .sheet { min-height: 240px; display: flex; flex-direction: column; }
.quiz-q { font-size: 1.45rem; font-weight: 700; line-height: 1.6; padding-top: 18px; text-wrap: pretty; }
.quiz-cal .feedback { margin-top: 10px; }
.mame { margin-top: 6px; padding: 12px 14px; background: #edf0f6; border-radius: 8px; font-size: 1.05rem; line-height: 1.75; }
.mame b { display: block; font-family: var(--f-brush); font-weight: 400; color: var(--shu); font-size: 1.2rem; letter-spacing: 0.1em; }
.opts { display: grid; gap: 12px; }
.opt {
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px;
  min-height: 72px; padding: 10px 16px; text-align: left;
  background: var(--washi); color: var(--sumi); border: 4px solid transparent; border-radius: 10px;
  box-shadow: 0 5px 0 #0c1426; font-size: 1.25rem; font-weight: 700; line-height: 1.4;
}
.opt:active { transform: translateY(3px); box-shadow: 0 2px 0 #0c1426; }
.opt .kana {
  width: 1.9em; height: 1.9em; border-radius: 50%; border: 2px solid var(--ai); color: var(--ai);
  display: grid; place-items: center; font-family: var(--f-brush); font-weight: 400; font-size: 1.25rem;
}
.opt.right { border-color: var(--shu); }
.opt.right .kana { background: var(--shu); border-color: var(--shu); color: #fff; }
.opt.wrong { background: #c9ced9; }
.opts[aria-disabled="true"] .opt:not(.right):not(.wrong) { opacity: 0.45; }
.opts[aria-disabled="true"] .opt { transform: none; }

/* 画面の低いスマホでも「こたえる」まで1画面に収める */
@media (max-height: 760px) {
  .app { padding-block: 8px 16px; }
  #play { gap: 12px; }
  .himekuri { padding-top: 14px; }
  .play-cal .sheet { min-height: 0; padding-top: 22px; padding-bottom: 10px; }
  .formula { padding-top: 8px; }
  .answer-row { padding-top: 2px; }
  .feedback { min-height: 1.8em; padding-top: 4px; }
  .key { min-height: 58px; }
}
@media (max-height: 700px) {
  .quit { min-height: 46px; }
  .pad { gap: 8px; }
  .key { min-height: 52px; font-size: 2rem; }
  .play-cal .sheet-top { padding-bottom: 4px; }
  .answer { font-size: clamp(2.4rem, 12vw, 3rem); }
}

@media (prefers-reduced-motion: no-preference) {
  .sheet.tear { animation: tear .5s cubic-bezier(.5, 0, .75, 0) forwards; }
  .sheet.enter { animation: enter .35s ease-out; }
  .stamp.press { animation: press .45s cubic-bezier(.2, 1.4, .4, 1); }
  .feedback.pop { animation: pop .35s ease-out; }
  @keyframes tear { 0% { transform: none; } 30% { transform: rotate(-3deg) translateY(-4px); } 100% { transform: rotate(-14deg) translate(-30px, -90px); opacity: 0; } }
  @keyframes enter { from { filter: brightness(.9); transform: translateY(6px); } to { filter: none; transform: none; } }
  @keyframes press { 0% { transform: rotate(-9deg) scale(1.7); opacity: 0; } 100% { transform: rotate(-9deg) scale(1); opacity: .92; } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
}
</style>
</head>
<body>
<main class="app">
  <!-- ホーム -->
  <section id="home">
    <div class="title-block">
      <h1>まいにち計算<span class="maru">。</span></h1>
      <p>一日一枚ずつ、めくるように。1回10問です。</p>
    </div>

    <div class="himekuri">
      <div class="binding"><span class="ring"></span><span class="ring"></span></div>
      <div class="stack" id="homeStack">
        <div class="sheet">
          <div class="sheet-top"><span id="wareki">令和八年</span><span id="month">十月</span></div>
          <div class="day" id="day">30</div>
          <div class="weekday" id="weekday">金曜日</div>
          <div class="sheet-foot" aria-live="polite">今日の正解<b id="todayCount">0</b>問</div>
        </div>
      </div>
    </div>

    <div class="group">
      <h2>なにをしますか</h2>
      <div class="choices list" id="games">
        <button class="choice" id="g-calc" data-game="calc" aria-pressed="true"><span class="sym">＋</span><span class="name">計算</span><span class="ex">数字で答える</span></button>
        <button class="choice" id="g-quiz" data-game="quiz" aria-pressed="false"><span class="sym">問</span><span class="name">4択クイズ</span><span class="ex">豆知識つき</span></button>
        <button class="choice" id="g-mix" data-game="mix" aria-pressed="false"><span class="sym">混</span><span class="name">ごちゃまぜ</span><span class="ex">計算とクイズがまざる</span></button>
      </div>
    </div>

    <div class="group" id="calcOpts">
    <div class="group" id="modeGroup">
      <h2>どの計算をしますか</h2>
      <div class="choices" id="modes">
        <button class="choice" id="m-add" data-mode="add" aria-pressed="true"><span class="sym">＋</span><span class="name">足し算</span><span class="ex">例 3＋5</span></button>
        <button class="choice" id="m-sub" data-mode="sub" aria-pressed="false"><span class="sym">－</span><span class="name">引き算</span><span class="ex">例 9－4</span></button>
        <button class="choice" id="m-mul" data-mode="mul" aria-pressed="false"><span class="sym">×</span><span class="name">掛け算</span><span class="ex">九九</span></button>
        <button class="choice" id="m-mix" data-mode="mix" aria-pressed="false"><span class="sym">？</span><span class="name">おまかせ</span><span class="ex">いろいろ</span></button>
      </div>
    </div>

    <div class="group">
      <h2>むずかしさ</h2>
      <div class="choices levels" id="levels">
        <button class="choice" id="l-easy" data-level="easy" aria-pressed="true"><span class="name">やさしい</span><span class="ex">1けた中心</span></button>
        <button class="choice" id="l-normal" data-level="normal" aria-pressed="false"><span class="name">ふつう</span><span class="ex">2けたも出ます</span></button>
        <button class="choice" id="l-hard" data-level="hard" aria-pressed="false"><span class="name">むずかしい</span><span class="ex">3けたの計算</span></button>
      </div>
    </div>
    </div>
    <div class="group" id="quizOpts" hidden>
      <h2>クイズのジャンル</h2>
      <div class="choices genres" id="genres">
        <button class="choice" id="q-all" data-genre="all" aria-pressed="true"><span class="name">おまかせ</span><span class="ex">時事も2問</span></button>
        <button class="choice" id="q-trick" data-genre="trick" aria-pressed="false"><span class="name">ひっかけ問題</span><span class="ex">よく読んで</span></button>
        <button class="choice" id="q-riddle" data-genre="riddle" aria-pressed="false"><span class="name">なぞなぞ</span><span class="ex">頭をやわらかく</span></button>

<script>
(function () {
  'use strict';
  const TOTAL = 10;
  const $ = (id) => document.getElementById(id);
  const S = { game: 'calc', genre: 'all', mode: 'add', level: 'easy', sound: true, screen: 'home', qs: [], i: 0, input: '', tries: 0, marks: [], first: 0, busy: false, picked: null };
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- 保存（この端末だけ） ----
  const todayKey = () => 'keisan-' + new Date().toLocaleDateString('sv');
  function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  // 保存データは書きかえられている可能性があるので、数として正しいものだけ使う
  function todayCount() { const v = load(todayKey(), 0); return Number.isInteger(v) && v >= 0 && v < 100000 ? v : 0; }
  function addToday() { save(todayKey(), todayCount() + 1); }
  const savePref = () => save('keisan-pref', { game: S.game, genre: S.genre, mode: S.mode, level: S.level, sound: S.sound });

  // ---- 漢数字（日めくりの表記） ----
  function kan(n) {
    const d = '〇一二三四五六七八九';
    if (n < 10) return d[n];
    const t = Math.floor(n / 10), o = n % 10;
    return (t > 1 ? d[t] : '') + '十' + (o ? d[o] : '');
  }

  // ---- 問題づくり ----
  const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function makeQ(mode, level) {
    if (mode === 'mix') mode = ['add', 'sub', 'mul'][r(0, 2)];
    // 答えはどのむずかしさでも3けたまで
    const L = { easy: 0, normal: 1, hard: 2 }[level];
    let a, b, op, ans;
    if (mode === 'add') {
      [a, b] = [[r(1, 9), r(1, 9)], [r(10, 59), r(3, 39)], [r(100, 499), r(100, 499)]][L];
      op = '＋'; ans = a + b;
    } else if (mode === 'sub') {
      const [x, y] = [[r(1, 9), r(1, 9)], [r(5, 59), r(3, 39)], [r(100, 499), r(100, 499)]][L];
      a = x + y; b = y; op = '－'; ans = x;
    } else {
      [a, b] = [[r(1, 5), r(1, 9)], [r(2, 9), r(2, 9)], [r(101, 199), r(2, 5)]][L];
      op = '×'; ans = a * b;
    }
    return { text: a + ' ' + op + ' ' + b, ans };
  }
  function makeSet() {
    const list = [];
    while (list.length < TOTAL) {
      const q = makeQ(S.mode, S.level);
      if (!list.some((p) => p.text === q.text)) list.push(q);
    }
    return list;
  }

  // ---- 4択クイズの問題（先頭の選択肢が正解。出すときに並べかえる） ----
  // 古くならない問題
  const QUIZ = [
    { tag: '季節', q: '十五夜のお月見で、お供えする代表的なものは？', c: ['月見だんご', '柏餅', 'ひなあられ', 'ちまき'], m: '十五夜は昔のこよみの8月15日の月。いっしょに飾るススキは、実った稲穂に見立てたものといわれます。' },
    { tag: '季節', q: '冬至の日に入るとよいとされるお風呂は？', c: ['ゆず湯', '菖蒲湯', '桃の湯', 'よもぎ湯'], m: '「冬至」と「湯治」をかけた、という説もあります。菖蒲湯は5月の端午の節句に入るお風呂です。' },
    { tag: '季節', q: '1年でいちばん昼が短い日は？', c: ['冬至', '夏至', '春分の日', '秋分の日'], m: '東京の冬至の昼の長さは約9時間45分。夏至とくらべると、約5時間も短くなります。' },
    { tag: '季節', q: '「春の七草」に入っていないものは？', c: ['ききょう', 'なずな', 'すずな', 'すずしろ'], m: 'ききょうは「秋の七草」です。すずなはカブ、すずしろは大根のこと。七草がゆは1月7日に食べます。' },
    { tag: '季節', q: '5月5日、端午の節句に食べるお菓子は？', c: ['柏餅', '桜餅', 'おはぎ', '月見だんご'], m: '柏の葉は、新しい芽が育つまで古い葉が落ちません。そこから「家が絶えない」縁起物とされてきました。' },
    { tag: '季節', q: '節分の豆まきのかけ声は？', c: ['鬼は外、福は内', '福は外、鬼は内', '鬼さんこちら', 'ごめんください'], m: '節分は「季節を分ける」日。もともとは立春・立夏・立秋・立冬の前の日、年に4回ありました。' },
    { tag: '季節', q: '「お彼岸」は1年に何回ある？', c: ['2回', '1回', '4回', '12回'], m: '春分の日と秋分の日をまん中にした7日間です。「暑さ寒さも彼岸まで」と言いますね。' },
    { tag: '季節', q: '七夕の織姫と彦星。二人を隔てている川は？', c: ['天の川', '三途の川', '隅田川', '鴨川'], m: '織姫は「こと座」のベガ、彦星は「わし座」のアルタイルという星です。' },
    { tag: '季節', q: '10月の昔の呼び名「神無月」。出雲地方では何と呼ぶ？', c: ['神在月', '神来月', '神集月', '神楽月'], m: '10月には全国の神様が出雲大社に集まるとされ、出雲だけは神様がいる月「神在月」になります。' },
    { tag: '季節', q: '昔の呼び名で「師走」は何月？', c: ['12月', '1月', '3月', '6月'], m: '年の暮れは、お坊さん（師）も走り回るほど忙しいから、という説がよく知られています。' },
    { tag: 'くらし', q: '「敬老の日」は何月？', c: ['9月', '5月', '10月', '11月'], m: '昔は9月15日と決まっていましたが、2003年から「9月の第3月曜日」になりました。' },
    { tag: 'くらし', q: '「8020（はちまるにいまる）運動」とは？', c: ['80歳で歯を20本残そう', '80歳まで毎日20分歩こう', '1日8000歩、20時に寝よう', '80点以上を20回とろう'], m: '歯が20本あれば、たいていの物をかんで食べられるといわれます。1989年に始まった運動です。' },
    { tag: 'ことわざ', q: '「猫に〇〇」。〇〇に入るのは？', c: ['小判', '鰹節', '真珠', '鈴'], m: '値打ちがわからない人に良い物をあげてもむだ、という意味。「豚に真珠」も同じ意味で、こちらは聖書から来た言葉です。' },
    { tag: 'ことわざ', q: '「〇〇の川流れ」。名人でも失敗する、という意味。〇〇は？', c: ['河童', '猿', '鯉', '亀'], m: '同じ意味のことわざに「猿も木から落ちる」「弘法にも筆の誤り」があります。' },
    { tag: 'ことわざ', q: '「石の上にも〇年」。〇に入る数は？', c: ['三', '一', '五', '十'], m: '冷たい石でも三年座り続ければ温まる。がまん強く続ければ報われる、というたとえです。' },
    { tag: 'ことわざ', q: '「急がば〇〇」。〇〇に入るのは？', c: ['回れ', '走れ', '止まれ', '休め'], m: '室町時代の歌が元とされます。琵琶湖を船で渡るより、遠回りでも瀬田の橋を歩くほうが確か、という内容です。' },
    { tag: 'ことわざ', q: '「笑う門には〇来たる」。〇に入るのは？', c: ['福', '春', '鬼', '客'], m: 'いつも笑い声のある家には、自然と幸せがやってくる、という意味です。' },
    { tag: '漢字', q: '「紫陽花」の読み方は？', c: ['あじさい', 'すみれ', 'ききょう', 'あさがお'], m: '土が酸性だと青っぽく、アルカリ性だと赤っぽい花になります。土で色が変わる花です。' },
    { tag: '漢字', q: '「向日葵」の読み方は？', c: ['ひまわり', 'たんぽぽ', 'あやめ', 'なでしこ'], m: '太陽を追って向きを変えるのは、つぼみのころまで。花が開くと、ほとんど東を向いたままになります。' },
    { tag: '漢字', q: '「秋刀魚」の読み方は？', c: ['さんま', 'さわら', 'たちうお', 'かつお'], m: '刀のように細長く光る姿で、秋においしくなる魚だから、この字が当てられています。' },
    { tag: '漢字', q: '「蒲公英」の読み方は？', c: ['たんぽぽ', 'れんげ', 'つくし', 'よもぎ'], m: '綿毛はひとつひとつがタネ。風に乗って何キロも飛んでいくことがあります。' },
    { tag: '地理', q: '日本でいちばん長い川は？', c: ['信濃川', '利根川', '石狩川', '四万十川'], m: '長さは367キロ。長野県では「千曲川」と呼ばれ、新潟県に入ると「信濃川」になります。' },
    { tag: '地理', q: '日本でいちばん大きい湖は？', c: ['琵琶湖', '霞ヶ浦', '浜名湖', '十和田湖'], m: '滋賀県の広さのおよそ6分の1をしめています。京都や大阪の水道水にも使われています。' },

    { tag: '地理', q: '日本の都道府県の数は？', c: ['47', '43', '48', '50'], m: '1都（東京）・1道（北海道）・2府（大阪・京都）・43県です。' },
    { tag: 'なつかし', q: '1964年、東京オリンピックの直前に開業したのは？', c: ['東海道新幹線', '青函トンネル', '東京スカイツリー', '瀬戸大橋'], m: '開業は10月1日。オリンピックの開会式があった10月10日は、のちに「体育の日」になりました。' },

    for (let t = 0; t <= 1; t += 0.008) {

    const d = 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');

  }
  function submit() {
    if (S.busy || !S.input) return;
    const q = S.qs[S.i];
    if (Number(S.input) === q.ans) {
      if (S.tries === 0) S.first++;
      S.marks[S.i] = 'ok'; S.busy = true;
      addToday();
      tone([660, 880], 0.14);
      hana(true);
      setFeedback(S.tries === 0 ? 'せいかい！' : 'せいかい！よく考えました', 'ok');
      renderPlay(); setTimeout(next, 1500);
    } else if (S.tries === 0) {
      S.tries = 1; S.input = '';
      tone([300], 0.18);
      setFeedback('おしい！もう一度どうぞ', 'ng');
      renderPlay();
    } else {
      S.marks[S.i] = 'ng'; S.busy = true; S.input = String(q.ans);
      setFeedback('答えは ' + q.ans + ' でした', 'ng');
      renderPlay(); $('ans').classList.add('red');
      setTimeout(next, 2700);
    }
  }
  function press(k) {
    if (S.busy) return;
    if (k === 'ok') return submit();
    if (k === 'del') S.input = S.input.slice(0, -1);
    else if (S.input.length < 4) S.input = (S.input === '0' ? '' : S.input) + k;
    renderPlay();
  }
  function finish() {
    const ok = S.marks.filter((m) => m === 'ok').length;
    const words = ok === TOTAL ? ['たいへん', 'よくできました'] : ok >= 7 ? ['よく', 'できました'] : ok >= 4 ? ['がんばり', 'ました'] : ['まいにち', 'つづけよう'];
    $('st1').textContent = words[0]; $('st2').textContent = words[1];
    $('score').textContent = ok;
    const now = new Date();
    $('resDate').textContent = kan(now.getMonth() + 1) + '月' + kan(now.getDate()) + '日';
    $('detail').textContent = (S.game === 'quiz' ? '4択クイズ' : S.game === 'mix' ? 'ごちゃまぜ' : '1回目で正解 ' + S.first + '問') + ' ／ 今日の合計 ' + todayCount() + '問';
    show('result');
    const st = $('stamp'); st.classList.remove('press'); void st.offsetWidth; st.classList.add('press');
    tone([523, 659, 784], 0.16);
  }

  // ---- 操作 ----
  $('games').addEventListener('click', (e) => { const b = e.target.closest('.choice'); if (b) { S.game = b.dataset.game; savePref(); renderHome(); } });
  $('genres').addEventListener('click', (e) => { const b = e.target.closest('.choice'); if (b) { S.genre = b.dataset.genre; savePref(); renderHome(); } });
  $('opts').addEventListener('click', (e) => { const b = e.target.closest('.opt'); if (b) pick(Number(b.dataset.n)); });
  $('nextBtn').addEventListener('click', nextQuiz);
  $('quitQuizBtn').addEventListener('click', () => { $('zsheet').classList.remove('tear'); renderHome(); show('home'); });
  $('modes').addEventListener('click', (e) => { const b = e.target.closest('.choice'); if (b) { S.mode = b.dataset.mode; savePref(); renderHome(); } });
  $('levels').addEventListener('click', (e) => { const b = e.target.closest('.choice'); if (b) { S.level = b.dataset.level; savePref(); renderHome(); } });
  $('soundBtn').addEventListener('click', () => { S.sound = !S.sound; savePref(); renderHome(); });
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('homeBtn').addEventListener('click', () => { renderHome(); show('home'); });
  $('quitBtn').addEventListener('click', () => { S.busy = false; $('qsheet').classList.remove('tear'); renderHome(); show('home'); });
  $('pad').addEventListener('click', (e) => { const b = e.target.closest('.key'); if (b) press(b.dataset.k); });
  document.addEventListener('keydown', (e) => {
    if (S.screen === 'quiz') {
      if (/^[1-4]$/.test(e.key)) pick(Number(e.key) - 1);
      return;
    }
    if (S.screen !== 'play') return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
    else if (e.key === 'Enter') { e.preventDefault(); press('ok'); }
  });

  // ---- 起動（更新時は途中の状態を引き継ぐ） ----
  // 読み込んだ設定は、決まった値のどれかであるときだけ使う
  const CHOICES = {
    game: ['calc', 'quiz', 'mix'], genre: ['all'].concat(Object.keys(GENRES)),
    mode: ['add', 'sub', 'mul', 'mix'], level: ['easy', 'normal', 'hard']
  };
  function applyPref(p) {
    if (!p || typeof p !== 'object') return;
    Object.keys(CHOICES).forEach((k) => { if (CHOICES[k].includes(p[k])) S[k] = p[k]; });
    if (typeof p.sound === 'boolean') S.sound = p.sound;
  }
  const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  const isStr = (v) => typeof v === 'string' && v.length < 300;
  function validItem(q) {
    if (!q || typeof q !== 'object') return false;
    if (q.opts === undefined) return isStr(q.text) && /^\d{1,3} [＋－×] \d{1,3}$/.test(q.text) && isInt(q.ans, 0, 9999);
    return isStr(q.q) && isStr(q.m) && isStr(q.tag) && Array.isArray(q.opts) && q.opts.length === 4 && q.opts.every(isStr) && isInt(q.ans, 0, 3);
  }
  // 更新で引き継いだ途中の状態は、形が正しいときだけ使う
  function applySession(s) {
    if (!s || typeof s !== 'object') return;
    if (!Array.isArray(s.qs) || s.qs.length !== TOTAL || !s.qs.every(validItem)) return;
    if (!isInt(s.i, 0, TOTAL - 1) || !['play', 'quiz'].includes(s.screen)) return;
    if (!Array.isArray(s.marks) || s.marks.length > TOTAL || !s.marks.every((m) => m === 'ok' || m === 'ng' || m == null)) return;
    applyPref(s);
    Object.assign(S, {
      qs: s.qs, i: s.i, screen: s.screen, marks: s.marks,
      first: isInt(s.first, 0, TOTAL) ? s.first : 0,
      tries: s.tries === 1 ? 1 : 0,
      input: typeof s.input === 'string' && /^\d{0,4}$/.test(s.input) ? s.input : '',
      picked: isInt(s.picked, 0, 3) ? s.picked : null,
      busy: false
    });
  }
  function start(data) {
    applyPref(load('keisan-pref', null));
    if (data && data.S) applySession(data.S);
    renderHome();
    if (S.screen === 'play' || S.screen === 'quiz') { S.screen = ''; showCurrent(); }
    else show('home');
  }
  window.claude?.hot?.snapshot?.(() => ({ S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
